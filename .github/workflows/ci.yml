name: CI Frontend

on:
  push:
    branches: [front]
  pull_request:
    branches: [front]

jobs:
  test:
    name: Instalar dependências e rodar testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run tests
        env:
          CI: true
        run: npm run test-play
        continue-on-error: true

  deploy:
    name: Deploy para Render (após testes)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/front'
    steps:
      - name: Trigger deploy on Render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL_FRONT }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL_FRONT not set"
            exit 1
          fi
          curl "${{ secrets.RENDER_DEPLOY_HOOK_URL_FRONT }}"
